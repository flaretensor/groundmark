[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "groundmark"
version = "0.1.0"
description = "Live-web research agent with claim-level source verification"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
    "langgraph>=1",
    "langgraph-checkpoint-sqlite>=3",
    "langgraph-checkpoint-postgres>=3",
    "psycopg[binary]>=3.2",
    "pydantic>=2.11",
    "pydantic-settings>=2.9",
    "openai>=2",
    "tavily-python>=0.8.5",
    "python-dotenv>=1.1",
    "fastapi>=0.120",
    "uvicorn>=0.35",
    "httpx>=0.28",
    "streamlit>=1.51",
    "requests>=2.32",
    "langsmith>=0.4",
    "mcp>=1.20,<2",
    "anyio>=4",
    "pyarrow>=20",
    "duckdb>=1.4",
    "opentelemetry-api>=1.38",
    "opentelemetry-sdk>=1.38",
    "opentelemetry-exporter-otlp-proto-http>=1.38",
    "opentelemetry-exporter-prometheus>=0.59b0",
    "prometheus-client>=0.22",
]

[project.optional-dependencies]
rerank = ["sentence-transformers>=5.1", "torch>=2.8"]
eval = [
    "torch>=2.8",
    "transformers>=4.56,<5",
    "sentencepiece>=0.2",
    "protobuf>=5",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    "numpy>=2",
    "mlflow-skinny>=3.5",
    "minicheck==0.1.0",
    "nltk>=3.9",
]

[project.scripts]
groundmark = "groundmark.cli:main"
groundmark-mcp = "groundmark.mcp_server:main"
groundmark-eval = "groundmark.eval.cli:main"

[dependency-groups]
dev = ["pytest>=8.4", "pytest-socket>=0.7", "ruff>=0.14"]

[tool.hatch.build.targets.wheel]
packages = ["src/groundmark"]

[tool.uv]
conflicts = [
    [
        { extra = "rerank" },
        { extra = "eval" },
    ],
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
minicheck = { git = "https://github.com/Liyan06/MiniCheck", rev = "b58b9fa69acbd1015ec970fa65dd752413a053d2" }
torch = [
    { index = "pytorch-cpu", extra = "rerank", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
    { index = "pytorch-cu128", extra = "eval", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[tool.pytest.ini_options]
addopts = "--disable-socket --allow-unix-socket -q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
