name: groundmark

services:
  api:
    build:
      context: .
      target: api
    image: groundmark-api:local
    user: "${GROUNDMARK_UID:-1000}:${GROUNDMARK_GID:-1000}"
    ports:
      - "127.0.0.1:${GROUNDMARK_API_PORT:-8100}:8100"
    env_file:
      - path: .env
        required: false
      - path: .env.compose
        required: false
    environment:
      GROUNDMARK_CONTAINER: "1"
      GROUNDMARK_RERANKER: cross-encoder
      MLFLOW_TRACKING_URI: http://mlflow:5000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://mlflow:5000/v1/traces
    volumes:
      - ./.artifacts:/app/.artifacts
      - ./.cache/compose-runtime:/app/.cache
      - ./.cache/huggingface:/home/groundmark/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
  ui:
    build:
      context: .
      target: ui
    image: groundmark-ui:local
    ports:
      - "127.0.0.1:${GROUNDMARK_UI_PORT:-8601}:8601"
    environment:
      GROUNDMARK_API_URL: http://api:8100
    depends_on:
      api:
        condition: service_healthy
  postgres:
    image: postgres:17-alpine@sha256:526f86d93c6ea08fd3f1fe5605650cacc781b2c6013169a0ad8f42c7d3d84f32
    ports:
      - "127.0.0.1:${GROUNDMARK_POSTGRES_PORT:-5433}:5432"
    env_file:
      - path: .env.compose
        required: false
    environment:
      POSTGRES_USER: groundmark
      POSTGRES_DB: postgres
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./deploy/postgres-init.sql:/docker-entrypoint-initdb.d/10-groundmark.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "groundmark", "-d", "groundmark"]
      interval: 3s
      timeout: 3s
      retries: 20
  mlflow:
    build:
      context: .
      dockerfile: deploy/mlflow.Dockerfile
    image: groundmark-mlflow:local
    entrypoint: []
    command:
      - sh
      - -ec
      - >-
        exec mlflow server --host 0.0.0.0 --port 5000
        --backend-store-uri "$$MLFLOW_BACKEND_STORE_URI"
        --serve-artifacts --artifacts-destination /mlflow/artifacts
        --allowed-hosts "localhost:*,127.0.0.1:*,mlflow:5000"
    ports:
      - "127.0.0.1:${GROUNDMARK_MLFLOW_PORT:-5100}:5000"
    env_file:
      - path: .env.compose
        required: false
    volumes:
      - mlflow:/mlflow/artifacts
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:5000/health',timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  prometheus:
    image: prom/prometheus:v3.9.1@sha256:1f0f50f06acaceb0f5670d2c8a658a599affe7b0d8e78b898c1035653849a702
    profiles: [monitoring]
    ports:
      - "127.0.0.1:${GROUNDMARK_PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
  grafana:
    image: grafana/grafana:12.3.3@sha256:9e1e77ade304069aee3196e9a4f210830e96e80ce9a2640891eccc324b152faf
    profiles: [monitoring]
    ports:
      - "127.0.0.1:${GROUNDMARK_GRAFANA_PORT:-3100}:3000"
    env_file:
      - path: .env.compose
        required: false
    environment:
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
    volumes:
      - grafana:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/etc/grafana/groundmark-dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres:
  mlflow:
  prometheus:
  grafana:
